name: mamun-sir

# Ports chosen to avoid conflicts with Laragon (3306) and tirono-pcm (3320, 8100-8102)
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini:ro
    depends_on:
      - mysql

  web:
    image: nginx:alpine
    ports:
      - "8200:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  node:
    image: node:24-alpine
    init: true
    working_dir: /var/www/html
    command: sh -c "npm install && exec npm run dev"
    ports:
      - "5200:5200"
    volumes:
      - ./:/var/www/html
      # Linux-only native binaries; also much faster than the Windows bind mount
      - node-modules:/var/www/html/node_modules

  # Sends queued mail. Restart it after code changes: docker compose restart queue
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --backoff=60 --max-time=3600
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini:ro
    depends_on:
      - mysql

  # Catches outgoing mail locally, nothing reaches real inboxes. Inbox: http://localhost:8202
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8202:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  mysql:
    image: mysql:8.0
    ports:
      - "3330:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mamun_sir}
      MYSQL_USER: ${DB_USERNAME:-mamun}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8201:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - mysql

volumes:
  mysql-data:
  node-modules:
